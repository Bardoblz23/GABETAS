<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0F19">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gabetas">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Control de gabetas</title>
<style>
:root{--bg:#0B0F19;--p:#111827;--p2:#1f2937;--ln:#334155;--tx:#e5e7eb;--mu:#94a3b8;--bl:#2563eb;--gr:#16a34a;--am:#d97706;--rd:#dc2626;--vi:#7c3aed}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;font-size:15px}
#app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:5;background:var(--p);border-bottom:1px solid var(--p2);padding:calc(12px + env(safe-area-inset-top)) 16px 10px;display:flex;gap:10px;align-items:center}
.top .bk{width:36px;height:36px;border-radius:10px;background:var(--p2);display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.top h1{font-size:18px;line-height:1.2}.top p{font-size:12px;color:var(--mu);margin-top:2px}
.body{flex:1;padding:14px 16px 96px}
.nav{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;display:flex;background:var(--p);border-top:1px solid var(--p2);padding:6px 0 calc(8px + env(safe-area-inset-bottom));z-index:6}
.nav div{flex:1;text-align:center;font-size:11px;color:#64748b;position:relative;padding-top:2px}
.nav div b{display:block;font-size:20px;margin-bottom:1px}.nav .on{color:#60a5fa}
.nav .bd{position:absolute;top:-2px;left:56%;background:var(--am);color:#fff;border-radius:9px;font-size:10px;padding:0 6px;font-weight:700}
.tabs{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto}.tab{flex:1;min-width:54px;text-align:center;padding:10px 0;border-radius:12px;background:var(--p2);font-weight:700}.tab.on{background:var(--bl);color:#fff}
.row{background:var(--p);border:1px solid var(--p2);border-radius:14px;padding:11px 13px;margin-bottom:9px}
.row b{font-size:15px}.row small{display:block;color:var(--mu);font-size:12px;margin:2px 0 7px}
.bar{height:7px;background:var(--p2);border-radius:5px}.bar i{display:block;height:100%;background:#22c55e;border-radius:5px}
.pill{display:inline-block;font-size:10px;padding:2px 7px;border-radius:9px;background:#312e81;color:#c7d2fe;margin-left:6px;font-weight:600;vertical-align:1px}.pill.w{background:#78350f;color:#fde68a}.pill.g{background:#14532d;color:#bbf7d0}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}
.sp{position:relative;min-height:112px;border-radius:12px;background:var(--p);border:1px dashed #475569;padding:7px;font-size:12px;color:var(--mu);display:flex;flex-direction:column;justify-content:space-between}
.sp.ok{border:1px solid var(--gr);background:#0f2a1c;color:#d1fae5}.sp.cur{border:2px solid #3b82f6;background:#10213f;color:#fff}
.sp b{font-size:20px;color:#fff}.sp .nm{font-size:10.5px;line-height:1.15;color:#cbd5e1;max-height:36px;overflow:hidden}
.sp .th{height:30px;border-radius:7px;background:linear-gradient(135deg,#475569,#1e293b) center/cover}
.cnt{position:absolute;right:5px;top:5px;background:var(--vi);color:#fff;border-radius:9px;padding:1px 7px;font-size:11px;font-weight:700}.cnt.nw{background:var(--am)}
.btn{display:block;width:100%;text-align:center;padding:14px;border-radius:14px;background:var(--gr);font-weight:700;font-size:16px;margin-top:10px;color:#fff;border:0;font-family:inherit}
.btn.b{background:var(--bl)}.btn.g{background:var(--p2);color:#cbd5e1}.btn.s{padding:8px;font-size:13px;margin-top:6px;background:var(--am)}.btn.off{background:var(--p2);color:#64748b}.btn.d{background:var(--rd)}.btn.sm{padding:9px;font-size:13px}
.warn{background:#3b2a0a;border:1px solid #b45309;color:#fcd34d;border-radius:12px;padding:9px 11px;font-size:12.5px;margin:10px 0;line-height:1.4}
.ok-b{background:#0f2a1c;border:1px solid var(--gr);color:#bbf7d0;border-radius:12px;padding:9px 11px;font-size:12.5px;margin:10px 0;line-height:1.4}
.info{color:var(--mu);font-size:12px;line-height:1.5;margin:8px 2px}
.f{margin-bottom:9px}.f label{font-size:11px;color:var(--mu);display:block;margin-bottom:3px}
input[type=text],input[type=number],input[type=email],textarea,select{width:100%;background:var(--p);border:1px solid var(--ln);border-radius:11px;padding:11px 12px;font-size:15px;color:var(--tx);font-family:inherit}
textarea{min-height:120px;font-size:12px}
.seg{display:flex;gap:6px;margin-bottom:9px}.seg span{flex:1;text-align:center;padding:9px 0;border-radius:11px;background:var(--p2);font-size:12.5px;font-weight:700}.seg .on{background:var(--bl);color:#fff}
.gc{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px}.gc span{padding:7px 11px;border-radius:14px;background:var(--p2);font-size:12.5px;font-weight:700}.gc .on{background:var(--vi);color:#fff}
.photo{height:150px;border-radius:16px;background:linear-gradient(135deg,#64748b,#1e293b) center/cover;display:flex;align-items:center;justify-content:center;font-size:13px;color:#e2e8f0;margin-bottom:10px;position:relative}
.cam{position:absolute;right:10px;bottom:10px;background:var(--bl);border-radius:20px;padding:8px 13px;font-weight:700;font-size:13px;color:#fff}
.step{display:flex;align-items:center;justify-content:space-between;background:var(--p);border-radius:14px;padding:8px 10px;margin:6px 0}
.step span{width:56px;height:46px;border-radius:12px;background:var(--p2);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;user-select:none}
.step input{width:100px;text-align:center;font-size:30px;font-weight:800;background:transparent;border:0;color:#fff}
.it{background:var(--p);border:1px solid var(--p2);border-radius:14px;padding:9px;margin-bottom:8px}
.it .l{display:flex;gap:10px;align-items:center}.it .th{width:46px;height:46px;border-radius:9px;flex:none;background:linear-gradient(135deg,#475569,#1e293b) center/cover}
.it b{font-size:14px}.it small{display:block;color:var(--mu);font-size:11px;margin-top:2px}.it em{margin-left:auto;font-style:normal;font-size:24px;font-weight:800;padding-left:8px}
.ck{width:24px;height:24px;border-radius:7px;background:var(--gr);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;flex:none}.ck.o{background:var(--p2);border:1px solid #475569}
.tg{font-size:10px;padding:2px 7px;border-radius:9px;margin-right:4px}.tg.ok{background:#14532d;color:#bbf7d0}.tg.nw{background:#78350f;color:#fde68a}
.chp{display:inline-flex;align-items:center;gap:6px;background:#312e81;color:#e0e7ff;border-radius:14px;padding:6px 11px;font-size:13px;font-weight:700;margin:0 5px 6px 0}.chp i{font-style:normal;color:#a5b4fc;font-size:13px;padding-left:2px}.chp.add{background:var(--p2);color:var(--mu);border:1px dashed #475569}.chp.n{background:#374151;color:#e5e7eb}
.sec{font-size:11.5px;color:var(--mu);margin:12px 2px 6px;font-weight:700;letter-spacing:.04em}
.li{display:flex;justify-content:space-between;gap:10px;padding:8px 2px;border-bottom:1px solid var(--p2);font-size:13px}
.kp{display:flex;gap:9px;margin-bottom:12px}.kp div{flex:1;background:var(--p);border-radius:14px;padding:12px;text-align:center}.kp .big{font-size:30px;font-weight:800}.kp small{color:var(--mu);font-size:11px}
.sz{display:flex;align-items:center;justify-content:space-between;margin:8px 0;font-size:14px}.sz .s{display:flex;align-items:center;gap:10px}.sz .s span{width:38px;height:38px;border-radius:10px;background:var(--p2);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px}.sz .s b{min-width:26px;text-align:center;font-size:18px}
.mg{display:grid;gap:4px}.mg div{min-height:28px;border-radius:6px;background:#0f2a1c;border:1px solid var(--gr);font-size:10px;display:flex;align-items:center;justify-content:center;color:#bbf7d0}.mg .e{background:var(--p);border:1px dashed #475569;color:#64748b}.mg .x{background:#3b0f0f;border-color:var(--rd);color:#fecaca}.mg .h{background:none;border:0;color:var(--mu)}.mg .sg{border:2px solid #f59e0b;background:#3b2a0a;color:#fde68a;font-weight:700}
.rad{display:flex;gap:10px;align-items:center;background:var(--p);border:1px solid var(--ln);border-radius:12px;padding:11px;margin-bottom:8px;font-size:13px}.rad i{width:18px;height:18px;border-radius:50%;border:2px solid #64748b;flex:none}.rad.on{border-color:#3b82f6}.rad.on i{border-color:#3b82f6;background:radial-gradient(#3b82f6 45%,transparent 50%)}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#0b1220;border:1px solid var(--ln);color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;z-index:30;display:none;max-width:90%;text-align:center}
#modal{position:fixed;inset:0;background:#000a;z-index:20;display:none;align-items:flex-end;justify-content:center}
#modal .box{background:var(--p);border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));width:100%;max-width:520px;max-height:85vh;overflow:auto}
#modal h2{font-size:17px;margin-bottom:8px}
.sug{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}.sug span{background:var(--p2);border-radius:14px;padding:6px 11px;font-size:12px}
.link{color:#93c5fd;text-decoration:underline;font-size:12.5px}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<div id="modal"></div>
<input type="file" id="fotoIn" accept="image/*" capture="environment" style="display:none">
<input type="file" id="catIn" accept=".csv,.tsv,.txt,text/*" style="display:none">
<script src="jszip.min.js"></script>
<script>
'use strict';
/* ===================== utilidades ===================== */
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=(n,l=2)=>String(n).padStart(l,'0');
const colL=i=>String.fromCharCode(65+i);
const parseU=u=>{const m=/^(\d+)-([A-Z]+)(\d+)$/.exec(u||'');return m?{g:m[1],c:m[2],f:+m[3]}:null};
const norm=s=>String(s||'').trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const hoy=()=>new Date();
const stamp=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}`;
const SAMPLE='';

/* ===================== base de datos (IndexedDB) ===================== */
const DB={db:null,
 open(){return new Promise((ok,no)=>{const r=indexedDB.open('gabetas-app',1);r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('kv');d.createObjectStore('fotos')};r.onsuccess=()=>{DB.db=r.result;ok()};r.onerror=()=>no(r.error)})},
 get(st,k){return new Promise((ok,no)=>{const q=DB.db.transaction(st).objectStore(st).get(k);q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)})},
 put(st,k,v){return new Promise((ok,no)=>{const t=DB.db.transaction(st,'readwrite');t.objectStore(st).put(v,k);t.oncomplete=()=>ok();t.onerror=()=>no(t.error)})},
 del(st,k){return new Promise((ok,no)=>{const t=DB.db.transaction(st,'readwrite');t.objectStore(st).delete(k);t.oncomplete=()=>ok();t.onerror=()=>no(t.error)})},
 clear(){return new Promise((ok)=>{const t=DB.db.transaction(['kv','fotos'],'readwrite');t.objectStore('kv').clear();t.objectStore('fotos').clear();t.oncomplete=()=>ok()})}
};
const defaultState=()=>({v:1,
 cfg:{gabetas:[{id:'01',nombre:'Gabeta 01',cols:3,filas:4},{id:'02',nombre:'Gabeta 02',cols:3,filas:4},{id:'03',nombre:'Gabeta 03',cols:8,filas:8},{id:'04',nombre:'Gabeta 04',cols:8,filas:8}],
  grupos:[{nombre:'1A = 2A',celulas:['1A','2A']},{nombre:'3A–6A',celulas:['3A','4A','5A','6A']},{nombre:'1C = 2C',celulas:['1C','2C']}],
  celulas:['1A','2A','3A','4A','5A','6A','1C','2C'],vacios:{}},
 entries:[],pedidos:[],caps:[],meta:{cod:0,correo:'',gab:'03',catalogoFecha:null,cfgDirty:false,lotes:0}});
let S=defaultState();
let saveT=null;
function save(){clearTimeout(saveT);saveT=setTimeout(()=>{DB.put('kv','state',S).catch(()=>toast('No se pudo guardar en el celular'))},250)}
async function saveNow(){clearTimeout(saveT);await DB.put('kv','state',S)}

/* ===================== consultas ===================== */
const gab=id=>S.cfg.gabetas.find(g=>g.id===id);
const entriesAt=u=>S.entries.filter(e=>e.ubic===u);
const sinFoto=e=>!e.fotoId&&!e.fotoXls;
function filaInfo(g,f){
 const gb=gab(g);let contados=0,piezas=0;const tally={};
 for(let c=0;c<gb.cols;c++){const u=`${g}-${colL(c)}${f}`;const es=entriesAt(u);
  if(es.length||S.cfg.vacios[u])contados++;
  es.forEach(e=>{piezas+=Number(e.cant)||0;const gs=e.grupos&&e.grupos.length?e.grupos:['(sin grupo)'];gs.forEach(x=>tally[x]=(tally[x]||0)+1)})}
 const keys=Object.keys(tally).sort((a,b)=>tally[b]-tally[a]);
 let label,cls='',det='';
 if(!keys.length){label=contados?'Vacía':'sin contar'}
 else if(keys.length===1){label=keys[0]==='(sin grupo)'?'Sin grupo':keys[0];cls=keys[0]==='(sin grupo)'?'':'g'}
 else{label='Mezcla';cls='w';det=keys.slice(0,3).map(k=>`${k} (${tally[k]})`).join(' · ')}
 const dom=keys.find(k=>k!=='(sin grupo)')||null;
 return {contados,total:gb.cols,piezas,label,cls,det,dom,domN:dom?tally[dom]:0,tally};
}
function spaceFree(u){return entriesAt(u).length===0}
function suggestUbic(grupos){
 let first=null,rowEmpty=null;
 for(const gb of S.cfg.gabetas){for(let f=1;f<=gb.filas;f++){
  const info=filaInfo(gb.id,f);const vacia=Object.keys(info.tally).length===0;
  for(let c=0;c<gb.cols;c++){const u=`${gb.id}-${colL(c)}${f}`;if(!spaceFree(u))continue;
   if(info.dom&&grupos&&grupos.includes(info.dom))return u;
   if(!rowEmpty&&vacia)rowEmpty=u;if(!first)first=u}}}
 return rowEmpty||first;
}
const grupoDeCelula=a=>S.cfg.grupos.filter(g=>g.celulas.includes(a)).map(g=>g.nombre);
const knownCelulas=()=>{const s=new Set(S.cfg.celulas);S.cfg.grupos.forEach(g=>g.celulas.forEach(c=>s.add(c)));return [...s]};
const sinGrupo=()=>knownCelulas().filter(c=>!S.cfg.grupos.some(g=>g.celulas.includes(c)));
const pend=()=>S.caps.filter(c=>c.estado==='pend');
const sinUbicN=()=>S.entries.filter(e=>e.sinUbic&&!e.ubic).length;

/* ===================== UI base ===================== */
let UI={tab:'gab',stack:[{v:'home'}]};let D=null;let G=null;let LL=null;let PK=null;let CFGTAB='grupos';
const cur=()=>UI.stack[UI.stack.length-1];
function push(v,p){UI.stack.push(Object.assign({v},p||{}));render();window.scrollTo(0,0)}
function back(){if(UI.stack.length>1)UI.stack.pop();render();window.scrollTo(0,0)}
function tab(t){UI.tab=t;UI.stack=[{v:t==='gab'?'home':t==='llego'?'llego':t==='cfg'?'cfg':'enviar'}];render();window.scrollTo(0,0)}
function toast(m,ms=2600){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',ms)}
function modal(html){const m=document.getElementById('modal');m.innerHTML=`<div class="box">${html}</div>`;m.style.display='flex'}
function closeModal(){document.getElementById('modal').style.display='none'}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});

function shell(title,sub,body,showBack){
 const pn=pend().length;
 const nv=[['gab','▦','Gabetas'],['llego','📦','Llegó'],['cfg','⚙','Config'],['env','✉','Enviar']];
 return `<div class="top">${showBack?`<div class="bk" data-a="back">‹</div>`:''}<div><h1>${title}</h1>${sub?`<p>${sub}</p>`:''}</div></div>
 <div class="body">${body}</div>
 <div class="nav">${nv.map(([k,i,t])=>`<div class="${UI.tab===k?'on':''}" data-a="tab" data-t="${k}"><b>${i}</b>${t}${k==='env'&&pn?`<span class="bd">${pn}</span>`:''}</div>`).join('')}</div>`;
}

/* ===================== vistas ===================== */
const V={};
function render(){
 const c=cur();const f=V[c.v];
 document.getElementById('app').innerHTML=f?f(c):shell('Error','', 'Vista desconocida: '+esc(c.v));
}
V.home=function(){
 const gb=gab(S.meta.gab)||S.cfg.gabetas[0];S.meta.gab=gb.id;
 const sin=sinUbicN();
 let body='';
 body+=`<button class="btn b" style="margin:0 0 10px;font-size:17px;padding:15px" data-a="tab" data-t="llego">📦 Llegó material</button>`;
 if(sin)body+=`<div class="warn" data-a="sinubic" style="cursor:pointer">${sin} herramental${sin>1?'es':''} sin ubicación · toca para asignar</div>`;
 if(!S.entries.length&&!S.pedidos.length)body+=`<div class="ok-b">Para empezar: en <b>Enviar → Actualizar catálogo</b> carga el catálogo de tu Excel . También puedes empezar a contar de una vez.</div>`;
 body+=`<div class="tabs">${S.cfg.gabetas.map(g=>`<div class="tab ${g.id===gb.id?'on':''}" data-a="gab" data-g="${g.id}">${g.id}</div>`).join('')}</div>`;
 for(let f=1;f<=gb.filas;f++){const i=filaInfo(gb.id,f);
  body+=`<div class="row" data-a="fila" data-f="${f}" style="cursor:pointer"><b>Fila ${f} <span class="pill ${i.cls}">${esc(i.label)}</span></b><small>${i.det?esc(i.det)+' · ':''}${i.contados} de ${i.total} contados${i.piezas?' · '+i.piezas+' piezas':''}</small><div class="bar"><i style="width:${Math.round(100*i.contados/i.total)}%"></i></div></div>`}
 return shell('Control de gabetas',`${esc(gb.nombre)} · ${S.entries.length} registros · ${pend().length} por enviar`,body,false);
};
V.fila=function(c){
 const gb=gab(c.g),f=c.f,info=filaInfo(c.g,f);
 let cells='',next=null;
 for(let k=0;k<gb.cols;k++){const u=`${c.g}-${colL(k)}${f}`;const es=entriesAt(u);const vac=S.cfg.vacios[u];
  const n=es.length;const qty=es.reduce((a,e)=>a+(Number(e.cant)||0),0);
  if(!n&&!vac&&!next)next=u;
  const isNext=u===next;
  const name=n===1?esc(es[0].nombre):(n?`${n} herramentales`:(vac?'vacío':''));
  const th=n===1&&es[0].thumb?`<div class="th" style="background-image:url(${es[0].thumb})"></div>`:`<div style="height:30px"></div>`;
  const nuevo=es.some(e=>sinFoto(e)&&e.cant>0);
  cells+=`<div class="sp ${n?'ok':(isNext?'cur':'')}" data-a="esp" data-u="${u}">${colL(k)}${n>1?`<span class="cnt">${n}</span>`:(nuevo?`<span class="cnt nw">nuevo</span>`:'')}${n?th:''}<div class="nm">${name}</div>${n?`<b>${qty}</b>`:(isNext?'<b>?</b>':'<span>'+(vac?'':'vacío')+'</span>')}</div>`}
 let warn='';
 if(info.cls==='w'&&info.dom&&info.domN>=2){
  for(let k=0;k<gb.cols;k++){const u=`${c.g}-${colL(k)}${f}`;entriesAt(u).forEach(e=>{
   if(e.okMezcla||!(e.grupos&&e.grupos.length)||e.grupos.includes(info.dom))return;
   warn+=`<div class="warn">⚠ La columna ${colL(k)} (${esc(e.nombre)}) es del grupo ${esc(e.grupos.join(', '))}. ¿Moverla o dejarla?<div style="display:flex;gap:8px;margin-top:6px"><button class="btn sm b" style="margin:0" data-a="mover" data-id="${e.id}">Moverla</button><button class="btn sm g" style="margin:0" data-a="dejar" data-id="${e.id}">Dejarla aquí</button></div></div>`})}}
 const body=`<div class="grid">${cells}</div>${warn}
 <div class="info">Verde = contado · Azul = el que sigue · Gris punteado = pendiente</div>
 ${next?`<button class="btn b" data-a="esp" data-u="${next}" data-new="1">Contar columna ${parseU(next).c}</button>`:''}
 <button class="btn g" data-a="filaok" data-f="${f}">Marcar fila terminada</button>`;
 return shell(`${esc(gb.nombre)} · Fila ${f}`,`Etiqueta: <b style="color:#86efac">${esc(info.label)}</b> · ${info.contados} de ${info.total}`,body,true);
};
V.esp=function(c){
 const es=entriesAt(c.u);const p=parseU(c.u);
 let body='';

};

 let fotoId=null,thumb=null;
 if(d.blob){fotoId=uid();await DB.put('fotos',fotoId,d.blob);thumb=d.thumb}
 let e=d.entryId?S.entries.find(x=>x.id===d.entryId):S.entries.find(x=>x.codigo===d.codigo&&x.ubic===d.ubic&&d.ubic);
 const existeCodigo=S.entries.some(x=>x.codigo===d.codigo);

/* ===================== fotos ===================== */
function loadImage(file){return new Promise((ok,no)=>{const u=URL.createObjectURL(file);const i=new Image();i.onload=()=>{URL.revokeObjectURL(u);ok(i)};i.onerror=()=>no(new Error('imagen'));i.src=u})}
function scaled(img,max,q){const r=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);c.getContext('2d').drawImage(img,0,0,c.width,c.height);return new Promise(ok=>c.toBlob(b=>ok({blob:b,url:c.toDataURL('image/jpeg',q)}),'image/jpeg',q))}
document.getElementById('fotoIn').addEventListener('change',async ev=>{
 const f=ev.target.files[0];ev.target.value='';if(!f)return;
 try{
  const img=await loadImage(f);const big=await scaled(img,1280,0.72);const th=await scaled(img,160,0.6);
  if(window._fotoEsp){const u=window._fotoEsp;window._fotoEsp=null;const id=uid();await DB.put('fotos',id,big.blob);
   S.caps.push({id:uid(),fecha:new Date().toISOString(),tipo:'FotoEspacio',codigo:'',nombre:'Foto general del espacio',origen:'',cant:null,ubic:u,grupos:[],req:'',nota:'',fotoId:id,estado:'pend'});save();toast('Foto guardada');return}
  if(D){D.blob=big.blob;D.thumb=th.url;D.prev=th.url;
   const box=document.getElementById('photoBox');if(box){box.style.backgroundImage=`url(${big.url})`;box.innerHTML='<div class="cam">📷 Cambiar foto</div>'}
   D.prev=th.url}
 }catch(err){toast('No pude leer la foto')}
});
/* ===================== catálogo ===================== */
function parseTable(text){
 text=String(text||'').replace(/^﻿/,'');
 const first=text.split(/\r?\n/)[0]||'';
 const delim=first.includes('\t')?'\t':((first.split(';').length>first.split(',').length)?';':',');
 const rows=[];let row=[],cur='',q=false;
 for(let i=0;i<text.length;i++){const ch=text[i];
  if(q){if(ch==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}
  else if(ch==='"'&&cur==='')q=true;
  else if(ch===delim){row.push(cur);cur=''}
  else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cur);cur='';if(row.some(x=>x.trim()!==''))rows.push(row);row=[]}
  else cur+=ch}
 row.push(cur);if(row.some(x=>x.trim()!==''))rows.push(row);
 return rows;
}
function importCatalogo(text){
 try{
  const rows=parseTable(text);if(rows.length<2){toast('El catálogo está vacío');return}
  const hdr=rows[0].map(norm);const ix=n=>hdr.indexOf(n);
  if(ix('tipo')<0){toast('Falta la columna “tipo” en la primera fila');return}
  const g=(r,n)=>{const i=ix(n);return i<0?'':String(r[i]==null?'':r[i]).trim()};
  const peds={},items=[],grupos=[],gabs=[],cels=[];
  rows.slice(1).forEach(r=>{const t=norm(g(r,'tipo'));
   if(t==='pedido'){const req=g(r,'req');if(!req)return;(peds[req]=peds[req]||{req,proveedor:g(r,'proveedor'),entrega:g(r,'entrega').slice(0,10),lineas:[]}).lineas.push({codigo:g(r,'codigo'),nombre:g(r,'nombre'),cant:parseInt(g(r,'cantidad'))||1,area:g(r,'area')})}
   else if(t==='item'){items.push({codigo:g(r,'codigo'),nombre:g(r,'nombre'),ubic:g(r,'ubicacion').toUpperCase(),cant:parseInt(g(r,'existencia'))||0,grupos:g(r,'grupos').split(/[|;]/).map(x=>x.trim()).filter(Boolean),foto:norm(g(r,'foto'))==='si',area:g(r,'area')})}
   else if(t==='grupo'){const n=g(r,'nombre');if(n)grupos.push({nombre:n,celulas:g(r,'celulas').split(/[|;,\s]+/).filter(Boolean)})}
   else if(t==='gabeta'){const m=/\d+/.exec(g(r,'nombre'));if(m)gabs.push({id:pad(parseInt(m[0])),nombre:g(r,'nombre'),cols:parseInt(g(r,'columnas'))||8,filas:parseInt(g(r,'filas'))||8})}
   else if(t==='celula'){const n=g(r,'nombre');if(n)cels.push(n)}});
  if((grupos.length||gabs.length)&&S.meta.cfgDirty&&!confirm('Tienes cambios de configuración sin enviar. ¿Reemplazar grupos y gabetas con lo del Excel?'))return;
  const recib=new Set(S.pedidos.filter(p=>p.recibido).map(p=>p.req));
  S.pedidos=Object.values(peds).map(p=>Object.assign(p,{recibido:recib.has(p.req)}));
  let nuevos=0,act=0;
  items.forEach(it=>{
   const pendientes=S.caps.some(c=>c.estado==='pend'&&c.codigo===it.codigo);
   let e=S.entries.find(x=>x.codigo===it.codigo&&x.ubic===it.ubic);
   if(!e&&!it.ubic)e=S.entries.find(x=>x.codigo===it.codigo&&!x.ubic);
   if(e){if(!pendientes){e.cant=it.cant;if(it.ubic){e.ubic=it.ubic;e.sinUbic=false}}if(it.nombre)e.nombre=it.nombre;if(it.grupos.length)e.grupos=it.grupos;if(it.foto)e.fotoXls=true;act++}
   else{S.entries.push({id:uid(),codigo:it.codigo,nombre:it.nombre,origen:it.codigo&&/^ST-/i.test(it.codigo)?'Del pedido':'',grupos:it.grupos,ubic:it.ubic,cant:it.cant,fotoId:null,thumb:null,fotoXls:it.foto,sinUbic:false});nuevos++}});
  if(grupos.length){S.cfg.grupos=grupos;grupos.forEach(x=>x.celulas.forEach(c=>{if(!S.cfg.celulas.includes(c))S.cfg.celulas.push(c)}))}
  if(gabs.length)S.cfg.gabetas=gabs;
  cels.forEach(c=>{if(!S.cfg.celulas.includes(c))S.cfg.celulas.push(c)});
  items.forEach(it=>{if(it.area&&!S.cfg.celulas.includes(it.area)&&/^\d/.test(it.area))S.cfg.celulas.push(it.area)});
  Object.values(peds).forEach(p=>p.lineas.forEach(l=>{if(l.area&&/^\d+[A-Z]$/i.test(l.area)&&!S.cfg.celulas.includes(l.area))S.cfg.celulas.push(l.area)}));
  if(grupos.length||gabs.length)S.meta.cfgDirty=false;
  S.meta.catalogoFecha=new Date().toLocaleString('es-MX');save();
  if(!S.cfg.gabetas.some(x=>x.id===S.meta.gab))S.meta.gab=S.cfg.gabetas[0].id;
  modal(`<h2>Catálogo actualizado ✓</h2><div class="li"><span>Pedidos por llegar</span><b>${S.pedidos.filter(p=>!p.recibido).length}</b></div><div class="li"><span>Herramentales nuevos</span><b>${nuevos}</b></div><div class="li"><span>Herramentales actualizados</span><b>${act}</b></div><div class="li"><span>Grupos</span><b>${grupos.length||'sin cambio'}</b></div><div class="li"><span>Gabetas</span><b>${gabs.length||'sin cambio'}</b></div><button class="btn" data-a="closeM">Listo</button>`);
  UI.stack=[{v:'enviar'}];UI.tab='env';render();
 }catch(err){console.error(err);toast('No pude leer el catálogo: '+err.message)}
}

const XE=t=>String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g,'');
const colX=i=>String.fromCharCode(65+i);
function xCell(ref,v,s){
 if(v==null||v==='')return `<c r="${ref}" s="${s||0}"/>`;
 if(v&&v.img)return `<c r="${ref}" s="${s||0}" t="e" vm="${v.img}"><v>#VALUE!</v></c>`;
 if(v&&v.date)return `<c r="${ref}" s="2"><v>${v.date}</v></c>`;
 if(typeof v==='number'&&isFinite(v))return `<c r="${ref}" s="${s||0}"><v>${v}</v></c>`;
 return `<c r="${ref}" s="${s||0}" t="inlineStr"><is><t xml:space="preserve">${XE(v)}</t></is></c>`;
}
function xSheet(rows,widths,photoH){
 let o='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><sheetFormatPr defaultRowHeight="15"/>';
 if(widths)o+='<cols>'+widths.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join('')+'</cols>';
 o+='<sheetData>';
 rows.forEach((r,ri)=>{const h=ri===0?22:(r.some(v=>v&&v.img)?photoH:0);
  o+=`<row r="${ri+1}"${h?` ht="${h}" customHeight="1"`:''}>`+r.map((v,ci)=>xCell(colX(ci)+(ri+1),v,ri===0?1:0)).join('')+'</row>'});
 return o+'</sheetData></worksheet>';
}

async function buildXlsx(caps,conConfig,parte,total){
 const imgs=[];

  const d=new Date(c.fecha);const serial=(d.getTime()-d.getTimezoneOffset()*60000)/86400000+25569;
  rows.push([{date:serial},c.codigo||'',c.tipo,c.cant==null?'':Number(c.cant),c.ubic||'',c.nota||'',foto,c.id,c.nombre||'',c.origen||'',(c.grupos||[]).join(' | '),c.req||'',foto?'SI':'']);

 }

 const b=sheets.length;let rl=sheets.map((_,i)=>`<Relationship Id="rId${i+1}" Type="${NS}/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')+`<Relationship Id="rId${b+1}" Type="${NS}/styles" Target="styles.xml"/>`;
 if(n)rl+=`<Relationship Id="rId${b+2}" Type="${NS}/sheetMetadata" Target="metadata.xml"/><Relationship Id="rId${b+3}" Type="http://schemas.microsoft.com/office/2022/10/relationships/richValueRel" Target="richData/richValueRel.xml"/><Relationship Id="rId${b+4}" Type="http://schemas.microsoft.com/office/2017/06/relationships/rdRichValue" Target="richData/rdrichvalue.xml"/><Relationship Id="rId${b+5}" Type="http://schemas.microsoft.com/office/2017/06/relationships/rdRichValueStructure" Target="richData/rdrichvaluestructure.xml"/><Relationship Id="rId${b+6}" Type="http://schemas.microsoft.com/office/2017/06/relationships/rdRichValueTypes" Target="richData/rdRichValueTypes.xml"/>`;
 z.file('xl/_rels/workbook.xml.rels',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${rl}</Relationships>`);
 z.file('xl/styles.xml','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><numFmts count="1"><numFmt numFmtId="164" formatCode="yyyy\\-mm\\-dd\\ hh:mm"/></numFmts><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF1F2937"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="3"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0" applyAlignment="1"><alignment vertical="center"/></xf><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1" applyAlignment="1"><alignment horizontal="center" vertical="center"/></xf><xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1" applyAlignment="1"><alignment vertical="center"/></xf></cellXfs></styleSheet>');
 sheets.forEach((s,i)=>z.file(`xl/worksheets/sheet${i+1}.xml`,s[1]));
 if(n){
  z.file('xl/metadata.xml',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><metadata xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:xlrd="http://schemas.microsoft.com/office/spreadsheetml/2017/richdata"><metadataTypes count="1"><metadataType name="XLRICHVALUE" minSupportedVersion="120000" copy="1" pasteAll="1" pasteValues="1" merge="1" splitFirst="1" rowColShift="1" clearFormats="1" clearComments="1" assign="1" coerce="1"/></metadataTypes><futureMetadata name="XLRICHVALUE" count="${n}">${imgs.map((_,i)=>`<bk><extLst><ext uri="{3e2802c4-a4d2-4d8b-9148-e3be6c30e623}"><xlrd:rvb i="${i}"/></ext></extLst></bk>`).join('')}</futureMetadata><valueMetadata count="${n}">${imgs.map((_,i)=>`<bk><rc t="1" v="${i}"/></bk>`).join('')}</valueMetadata></metadata>`);

async function doEnviar(share){
 const P=pend();if(!P.length){toast('No hay nada pendiente');return}
 toast('Preparando Excel con fotos…',8000);
 try{
  // dividir por tamaño (~14 MB de fotos por archivo)
  const lotes=[];let curL=[],sz=0;
  for(const c of P){let s=0;if(c.fotoId){const b=await DB.get('fotos',c.fotoId);s=b?b.size:0}
   if(curL.length&&sz+s>14e6){lotes.push(curL);curL=[];sz=0}curL.push(c);sz+=s}
  if(curL.length)lotes.push(curL);
  const files=[];const st=stamp(new Date());
  for(let i=0;i<lotes.length;i++){const buf=await buildXlsx(lotes[i],i===0,i+1,lotes.length);
   const name=`Capturas_${st}${lotes.length>1?'_parte'+(i+1):''}.xlsx`;
   files.push(new File([buf],name,{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}))}
  document.getElementById('toast').style.display='none';
  const mail=(document.getElementById('mail')||{}).value||S.meta.correo;
  const texto=`Capturas de gabetas ${st}. ${P.length} movimientos.`;
  let hecho=false;
  if(share&&navigator.canShare&&navigator.canShare({files})){
   try{await navigator.share({files,title:'Capturas de gabetas',text:texto+(mail?` Enviar a: ${mail}`:'')});hecho=true}catch(e){if(e&&e.name==='AbortError')return}
  }
  if(!hecho){files.forEach(f=>{const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000)});
   if(share&&mail)window.open('mailto:'+mail+'?subject='+encodeURIComponent('Capturas de gabetas '+st)+'&body='+encodeURIComponent(texto+' Adjunta el archivo descargado.'),'_self')}
  setTimeout(()=>modal(`<h2>¿Ya lo mandaste?</h2><div class="info" style="margin:0 0 8px">Si ya lo enviaste (o lo descargaste para pasarlo), marco estas ${P.length} capturas como enviadas. Si no, déjalas pendientes y se incluirán en el siguiente envío.</div><button class="btn" data-a="marcarEnviado">Sí, ya lo mandé</button><button class="btn g" data-a="closeM">Todavía no</button>`),600);
 }catch(err){console.error(err);document.getElementById('toast').style.display='none';toast('Error al crear el Excel: '+err.message,5000)}
}
A.marcarEnviado=()=>{S.meta.lotes++;pend().forEach(c=>{c.estado='env';c.lote=S.meta.lotes});S.meta.cfgDirty=false;save();closeModal();render();toast('Marcado como enviado ✓')};
